# Publishes public/ to GitHub Pages. In the repo: Settings → Pages → Source → GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Pages serves assets with a 10 minute cache. Stamping the commit sha onto
      # every asset URL means a deploy is visible on the next page load, not ten
      # minutes later.
      - name: Stamp asset URLs with the commit sha
        run: |
          SHA="${GITHUB_SHA:0:8}"
          cd public
          sed -i -E "s|(src=\")([a-z-]+\.js)\"|\1\2?v=$SHA\"|g" index.html
          sed -i -E "s|(href=\")(styles\.css)\"|\1\2?v=$SHA\"|g" index.html
          grep -o 'v=[0-9a-f]*' index.html | sort -u
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
